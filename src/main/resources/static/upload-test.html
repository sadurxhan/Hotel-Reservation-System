<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Photo upload test</title>
</head>
<body style="font-family: Arial; padding: 30px;">

<h2>Photo upload test</h2>

<label>Upload for: </label>
<select id="type">
    <option value="activity">Activity</option>
    <option value="menu">Menu item</option>
</select>
<br><br>

<!-- the id number of the activity or menu item that gets the photo -->
<label>ID number: </label>
<input type="number" id="itemId" value="1" min="1">
<br><br>

<input type="file" id="photo" accept="image/*">
<br><br>

<button onclick="upload()">Upload</button>

<!-- the server's reply is shown here -->
<pre id="result"></pre>

<script>
    async function upload() {
        const type = document.getElementById('type').value;      // "activity" or "menu"
        const id = document.getElementById('itemId').value;
        const file = document.getElementById('photo').files[0];
        const result = document.getElementById('result');

        if (!file) {
            result.textContent = 'Please choose a photo first';
            return;
        }

        // Put the file in a form, the same way a normal upload form would
        const formData = new FormData();
        formData.append('file', file);   // "file" must match @RequestParam("file") in your controller

        // Send a POST to e.g. /api/activity/1/image
        const response = await fetch('/api/' + type + '/' + id + '/image',
            { method: 'POST', body: formData });
        result.textContent = response.status + '\n' + await response.text();
    }
</script>
</body>
</html>
