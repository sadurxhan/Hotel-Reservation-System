server.port=8081
spring.application.name=hotel

# MySQL Connection Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/hotel_reservation_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# PayHere Configuration
payhere.merchant-id=1211149
payhere.merchant-secret=4N8p1kO7Z3h4a8q8
payhere.checkout-url=https://sandbox.payhere.lk/pay/checkout

# ---- Email (owner notification for new inquiries) ----
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Read the values from environment variable and use blank if not set
app.owner.email=${OWNER_EMAIL:}

# ---- Image upload ----
app.upload-dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
