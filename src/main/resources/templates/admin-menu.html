<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage Menu</title>
    <style>
        body { font-family: Georgia, serif; background: #f5f0eb; margin: 0; padding: 40px; }
        .wrap { max-width: 1000px; margin: 0 auto; }
        .box { background: white; border-radius: 8px; padding: 24px 30px; margin-bottom: 24px; }
        h1, h2 { margin-top: 0; }
        input[type=text], textarea, select { width: 100%; padding: 9px; margin: 6px 0 12px; border: 1px solid #ccc;
            border-radius: 4px; box-sizing: border-box; font-family: inherit; }
        button { padding: 8px 14px; border: none; border-radius: 4px; color: white; cursor: pointer; font-size: 14px; }
        .primary { background: #6b1e3c; }
        .hide    { background: #b8823a; }
        .show    { background: #3f7d5c; }
        .delete  { background: #a33; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 12px 8px; border-bottom: 1px solid #eee; vertical-align: top; }
        img.thumb { width: 120px; height: 80px; object-fit: cover; border-radius: 4px; display: block; }
        .nophoto { width: 120px; height: 80px; background: #eee; color: #888; border-radius: 4px;
            display: flex; align-items: center; justify-content: center; font-size: 12px; }
        .badge { display: inline-block; padding: 3px 10px; border-radius: 12px; color: white; font-size: 12px; }
        .badge.on  { background: #3f7d5c; }
        .badge.off { background: #999; }
        .type { display: inline-block; padding: 2px 8px; border-radius: 4px; background: #ece2d0;
            color: #6b1e3c; font-size: 12px; margin: 4px 0; }
        tr.off-row td.info { opacity: 0.55; }   /* hidden meals look faded */
        .actions form { margin-bottom: 8px; }
    </style>
</head>
<body>
<div class="wrap">

    <div class="box">
        <h1>Manage Menu</h1>
        <p>Guests only see meals marked <b>Showing</b>. Use "Hide from menu" for a meal that isn't
            available today, and "Show on menu" to bring it back.
            <a th:href="@{/menu}" target="_blank">View the public menu</a></p>
    </div>

    <!-- Add a new meal. enctype="multipart/form-data" is REQUIRED for file uploads. -->
    <div class="box">
        <h2>Add a new meal</h2>
        <form th:action="@{/admin/menu/add}" method="post" enctype="multipart/form-data">
            <label>Title</label>
            <input type="text" name="title" required>

            <label>Meal type</label>
            <select name="mealType" required>
                <option value="BREAKFAST">Breakfast</option>
                <option value="LUNCH">Lunch</option>
                <option value="DINNER">Dinner</option>
                <option value="BEVERAGE">Beverage</option>
            </select>

            <label>Description</label>
            <textarea name="mealDescription" rows="3" required></textarea>

            <label>Photo (optional)</label><br>
            <input type="file" name="photo" accept="image/*">
            <br><br>
            <button type="submit" class="primary">Add meal</button>
        </form>
    </div>

    <!-- All meals, including hidden ones -->
    <div class="box">
        <h2>All meals</h2>
        <table>
            <tr><th>Photo</th><th>Meal</th><th>Status</th><th>Actions</th></tr>

            <!-- th:each repeats this row for every meal. th:classappend adds "off-row"
                 to hidden ones so they look faded -->
            <tr th:each="m : ${menuItems}" th:classappend="${!m.available} ? 'off-row'">

                <td>
                    <img class="thumb" th:if="${m.fileUrl != null}" th:src="${m.fileUrl}" alt="photo">
                    <div class="nophoto" th:if="${m.fileUrl == null}">No photo</div>
                </td>

                <td class="info">
                    <b th:text="${m.title}">Title</b><br>
                    <span class="type" th:text="${m.mealType}">LUNCH</span><br>
                    <span th:text="${m.mealDescription}">Description</span>
                </td>

                <td>
                    <!-- th:if shows the tag when true, th:unless when false -->
                    <span class="badge on"  th:if="${m.available}">Showing</span>
                    <span class="badge off" th:unless="${m.available}">Hidden</span>
                </td>

                <td class="actions">
                    <!-- Hide / Show -->
                    <form th:action="@{/admin/menu/{id}/toggle(id=${m.menuId})}" method="post">
                        <button type="submit" class="hide" th:if="${m.available}">Hide from menu</button>
                        <button type="submit" class="show" th:unless="${m.available}">Show on menu</button>
                    </form>

                    <!-- Add or replace photo -->
                    <form th:action="@{/admin/menu/{id}/image(id=${m.menuId})}"
                          method="post" enctype="multipart/form-data">
                        <input type="file" name="photo" accept="image/*" required>
                        <button type="submit" class="primary">Upload photo</button>
                    </form>

                    <!-- Delete (asks "are you sure?" first) -->
                    <form th:action="@{/admin/menu/{id}/delete(id=${m.menuId})}" method="post"
                          onsubmit="return confirm('Delete this meal permanently?');">
                        <button type="submit" class="delete">Delete</button>
                    </form>
                </td>
            </tr>
        </table>
    </div>

</div>
</body>
</html>
